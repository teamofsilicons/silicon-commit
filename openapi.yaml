openapi: 3.1.0
info:
  title: Silicon Commit API
  version: 0.5.0
  description: Collaborative work for Carbons and Silicons, signed in with Silicon Accounts. Contract 2 references accounts by permanent uuid. Visibility follows custodians, explicit sharing and project membership. The accounts close to a Carbon are the Silicons it looks after, and those close to a Silicon are its custodian and the custodian's other Silicons.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://commit.teamofsilicons.com/api/v1
security:
- bearerAuth: []
- proofAuth: []
tags:
- name: Operations
  description: Public build metadata for deployment verification.
- name: Notifications
  description: Silicon-owned webhook destination and delegated-todo subscriptions.
- name: Accounts
  description: Signing in with Silicon Accounts, the authenticated account, a Silicon's allow-list and account events.
- name: Todos
  description: Personal and delegated work, visible to its owner, its assignee and the accounts close to either.
- name: Projects
  description: Carbon and Silicon collaborative projects, visible to the owner, the accounts close to it and members (members only when private).
- name: Project Diary
  description: Optimistically concurrent project Markdown.
- name: Project Work
  description: Project tasks, blockers, updates, and completion.
- name: Attachments
  description: Provider-neutral attachment URL references stored on todos.
paths:
  /version:
    get:
      tags: [Operations]
      summary: Get service version
      operationId: getVersion
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Service build metadata.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /accounts:
    get:
      tags: [Accounts]
      summary: How to sign in to Commit
      operationId: getAccountsMetadata
      description: Public. Commit's app id at Silicon Accounts, the Accounts URLs to sign in with, and the scopes (action ids) another app can request in a User verification proof.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Sign-in metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountsMetadata'}
        default: {$ref: '#/components/responses/Error'}
  /me:
    get:
      tags: [Accounts]
      summary: Describe the authenticated account
      operationId: getMe
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: The account as Commit sees it.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /silicons/{silicon}/allowed-accounts:
    parameters:
    - $ref: '#/components/parameters/SiliconPath'
    get:
      tags: [Accounts]
      summary: List the accounts a Silicon accepts work from
      operationId: getAllowlist
      description: A Silicon takes todos and project invitations only from its custodian, the custodian's other Silicons and these accounts. Readable by the Silicon and its custodian.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: The Silicon's allow-list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allowlist'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /silicons/{silicon}/allowed-accounts/{account}:
    parameters:
    - $ref: '#/components/parameters/SiliconPath'
    - {name: account, in: path, required: true, description: 'The account to allow or remove, by c:/si: id or account uuid.', schema: {$ref: '#/components/schemas/ActorId'}}
    put:
      tags: [Accounts]
      summary: Allow an account to give a Silicon work
      operationId: allowAccount
      description: Changed by the Silicon or its custodian. The bearer token is also checked online.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: The updated allow-list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allowlist'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Accounts]
      summary: Stop accepting work from an account
      operationId: disallowAccount
      description: Work already assigned stays. Changed by the Silicon or its custodian; the bearer token is also checked online.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: The updated allow-list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allowlist'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /webhook/:
    post:
      tags: [Accounts]
      summary: Receive a Silicon Accounts account event
      operationId: receiveAccountsWebhook
      description: Silicon Accounts app webhook. The signature in X-Accounts-Signature is verified over "timestamp.body" with the webhook secret before the body is parsed; timestamps more than five minutes off are refused. Events are deduplicated on event_id; types Commit does not use are recorded and acknowledged.
      security: []
      parameters:
      - {name: X-Accounts-Timestamp, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}, description: Unix seconds when Silicon Accounts signed the delivery.}
      - {name: X-Accounts-Signature, in: header, required: true, schema: {type: string}, description: 'One or more v1=<hex HMAC-SHA256> signatures.'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountEvent'}
      responses:
        '200':
          description: Event applied, or already applied earlier (applied false).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountEventReceipt'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /notification-settings:
    get:
      tags: [Notifications]
      summary: Get the authenticated Silicon's notification settings
      operationId: getNotificationSettings
      description: Returns virtual version zero when the authenticated Silicon has never persisted settings. Carbons are forbidden.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/SiliconSelector'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Complete optional webhook destination and list-wide subscription.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            ETag: {$ref: '#/components/headers/NotificationETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Notifications]
      summary: Replace the authenticated Silicon's notification settings
      operationId: replaceNotificationSettings
      description: Complete optimistic-concurrency replacement. Both nullable properties must be sent explicitly.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/SiliconSelector'
      - $ref: '#/components/parameters/NotificationIfMatch'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSettingsUpdate'}
      responses:
        '200':
          description: Current settings after replacement or an exact stale retry.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            ETag: {$ref: '#/components/headers/NotificationETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        '409': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /todos:
    get:
      tags: [Todos]
      summary: List todos
      operationId: listTodos
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - {name: view, in: query, schema: {type: string, enum: [assigned_to_me, delegated_by_me, all], default: assigned_to_me}}
      - {name: status, in: query, schema: {$ref: '#/components/schemas/TodoStatus'}}
      - {name: assigned_to, in: query, schema: {$ref: '#/components/schemas/ActorId'}}
      - {name: assigned_by, in: query, schema: {$ref: '#/components/schemas/ActorId'}}
      - {name: created_from, in: query, schema: {type: string, format: date-time}}
      - {name: created_to, in: query, schema: {type: string, format: date-time}}
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
        description: Filter by related project; private access remains enforced.
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Filtered todos.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoPage'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Todos]
      summary: Create a todo
      operationId: createTodo
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoCreate'}
      responses:
        '201':
          description: Todo created.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /todos/{todo_id}:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    - $ref: '#/components/parameters/TodoId'
    get:
      tags: [Todos]
      summary: Get a todo
      operationId: getTodo
      responses:
        '200':
          description: Todo.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
      parameters:
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
    patch:
      tags: [Todos]
      summary: Update a todo
      operationId: updateTodo
      parameters: [$ref: '#/components/parameters/IdempotencyKey', $ref: '#/components/parameters/CommitVersion', $ref: '#/components/parameters/SupportedVersions', $ref: '#/components/parameters/TelemetryPreference']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: {$ref: '#/components/schemas/TitleText'}
                description: {$ref: '#/components/schemas/NullableDescriptionText'}
                assigned_to: {$ref: '#/components/schemas/ActorId'}
                status: {$ref: '#/components/schemas/TodoStatus'}
                attachments: {type: array, maxItems: 20, uniqueItems: true, items: {$ref: '#/components/schemas/AttachmentUrl'}}
                project_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
      responses:
        '200':
          description: Updated todo.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Todo'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Todos]
      summary: Delete a todo
      operationId: deleteTodo
      responses:
        '204':
          description: Todo deleted.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
      parameters:
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
  /todos/{todo_id}/notes:
    get:
      tags: [Todos]
      summary: List todo notes
      operationId: listTodoNotes
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/TodoId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Notes in reverse creation order.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotePage'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Todos]
      summary: Add a todo note
      operationId: addTodoNote
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/TodoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], additionalProperties: false, properties: {body: {$ref: '#/components/schemas/NoteText'}}}}}}
      responses:
        '201':
          description: Note created.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /todos/{todo_id}/notification-subscription:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    - $ref: '#/components/parameters/TodoId'
    get:
      tags: [Notifications]
      summary: Get the authenticated Silicon's todo-specific subscription
      operationId: getTodoNotificationSubscription
      description: Available only to the Silicon which assigned this active delegated todo. Returns virtual version zero when no override resource exists.
      responses:
        '200':
          description: Todo-specific override; a null subscription falls back to the current list-wide rule.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            ETag: {$ref: '#/components/headers/NotificationETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoNotificationSubscription'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
      parameters:
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
    put:
      tags: [Notifications]
      summary: Replace the authenticated Silicon's todo-specific subscription
      operationId: replaceTodoNotificationSubscription
      description: Complete optimistic-concurrency replacement. A non-null rule exclusively overrides the list rule; null removes the active override and restores list-rule fallback.
      parameters:
      - $ref: '#/components/parameters/NotificationIfMatch'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TodoNotificationSubscriptionUpdate'}
      responses:
        '200':
          description: Current todo-specific resource after replacement or an exact stale retry.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            ETag: {$ref: '#/components/headers/NotificationETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodoNotificationSubscription'}
        '409': {$ref: '#/components/responses/Error'}
        '428': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - {name: status, in: query, schema: {$ref: '#/components/schemas/ProjectStatus'}}
      - {name: silicon_id, in: query, schema: {$ref: '#/components/schemas/ActorId'}}
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Projects visible to the caller.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreate'}}}}
      responses:
        '201':
          description: Project created.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /projects/{project_id}:
    parameters:
    - $ref: '#/components/parameters/RequestId'
    - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get a project
      operationId: getProject
      responses:
        '200':
          description: Project.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
      parameters:
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
    patch:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      parameters: [$ref: '#/components/parameters/IdempotencyKey', $ref: '#/components/parameters/CommitVersion', $ref: '#/components/parameters/SupportedVersions', $ref: '#/components/parameters/TelemetryPreference']
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, minProperties: 1, additionalProperties: false, properties: {name: {$ref: '#/components/schemas/ProjectNameText'}, status: {$ref: '#/components/schemas/ProjectPatchStatus'}, silicon_ids: {
                  type: array, maxItems: 100, uniqueItems: true, description: 'Complete replacement set of Silicon members; it must retain the project owner when the owner is a Silicon.', items: {$ref: '#/components/schemas/ActorId'}}, description: {type: string,
                    maxLength: 100000, default: ''}, attachments: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/AttachmentUrl'}}, private: {type: boolean, default: false}, carbon_ids: {type: array,
                    maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/ActorId'}}}}
      responses:
        '200':
          description: Updated project.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /projects/{project_id}/diary:
    get:
      tags: [Project Diary]
      summary: Get the project diary
      operationId: getProjectDiary
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      responses:
        '200':
          description: Markdown diary.
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Diary'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Project Diary]
      summary: Replace the project diary
      operationId: updateProjectDiary
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CommitVersion'
      - $ref: '#/components/parameters/SupportedVersions'
      - $ref: '#/components/parameters/TelemetryPreference'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [markdown], additionalProperties: false, properties: {markdown: {$ref: '#/components/schemas/DiaryMarkdown'}}}}}}
      responses:
        '200':
          description: Updated diary.
          headers:
