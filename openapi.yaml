components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 'Silicon Accounts access token issued to commit (EdDSA JWT; aud commit, iss the Silicon Accounts URL), verified locally.'}
    proofAuth: {type: apiKey, in: header, name: Authorization, description: 'Proof sap_… : a Silicon Accounts User verification proof issued to another app for receiving app commit. It must grant the operation''s scope (its action id) and come from an app allowed for that scope (COMMIT_PROOF_ISSUERS).'}
  parameters:
    SiliconSelector: {name: silicon, in: query, required: false, description: 'The Silicon whose settings to use, by si: id or account uuid; only that Silicon or its custodian may. Omit to use the authenticated Silicon.', schema: {$ref: '#/components/schemas/ActorId'}}
    SiliconPath: {name: silicon, in: path, required: true, description: 'The Silicon, by si: id or account uuid.', schema: {$ref: '#/components/schemas/ActorId'}}
    RequestId: {name: X-Request-ID, in: header, required: false, description: Optional visible-ASCII correlation identifier which is returned unchanged when valid., schema: {type: string, minLength: 1, maxLength: 128,
          pattern: '^[!-~]+$'}}
    TodoId: {name: todo_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProjectId: {name: project_id, in: path, required: true, description: 'Project UUID or exact stable UID, bounded to 2,048 UTF-8 bytes. Bare slugs are not accepted; percent-encode a UID as exactly one path segment.',
        schema: {type: string, maxLength: 2048}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, description: Opaque case-sensitive replay key containing visible ASCII only., schema: {type: string, minLength: 8, maxLength: 255, pattern: '^[!-~]+$'}}
    IfMatch: {name: If-Match, in: header, required: true, description: Strong quoted ETag containing the last observed positive diary version., schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    NotificationIfMatch: {name: If-Match, in: header, required: true, description: 'One strong quoted canonical non-negative notification-resource version. Send "0" to create from the virtual absent resource.', schema: {
          type: string, pattern: '^"(?:0|[1-9][0-9]*)"$'}}
    Cursor: {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 1024}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    CommitVersion:
      name: X-Commit-API-Version
      in: header
      required: false
      description: Explicit API contract; currently 2 (1 has ended and answers 406).
      schema:
        type: string
    SupportedVersions:
      name: X-Commit-Supported-Versions
      in: header
      required: false
      description: Comma-separated supported versions; must include 2.
      schema:
        type: string
    TelemetryPreference:
      name: X-Commit-Telemetry
      in: header
      required: false
      description: Set off to disable diagnostics for this request.
      schema:
        type: string
  responses:
    Error:
      description: Stable redacted error envelope.
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        WWW-Authenticate: {$ref: '#/components/headers/WwwAuthenticate'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: A dependency or request policy temporarily rate-limited the operation.
      headers:
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        Cache-Control: {$ref: '#/components/headers/CacheControl'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  headers:
    XRequestId: {description: Request correlation identifier., schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}}
    CacheControl: {description: Responses are not cacheable by shared or private caches., schema: {type: string, const: no-store}}
    IdempotencyReplayed: {description: Whether this exact response was replayed from durable idempotency state., schema: {type: boolean}}
    Location: {description: Absolute canonical URL of the created resource., schema: {type: string, format: uri}}
    ETag: {description: Strong quoted diary version., schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    NotificationETag: {description: Strong quoted canonical non-negative notification-resource version., schema: {type: string, pattern: '^"(?:0|[1-9][0-9]*)"$'}}
    RetryAfter: {description: Minimum whole seconds before retrying a rate-limited request., schema: {type: integer, minimum: 1}}
    WwwAuthenticate: {description: Present on 401 responses to advertise bearer authentication., schema: {type: string, const: Bearer}}
  schemas:
    TitleText:
      type: string
      minLength: 1
      maxLength: 500
      pattern: '^(?=[\s\S]*\S)[^\u0000]*$'
      description: Nonblank text; surrounding whitespace counts toward the limit and is trimmed before storage. U+0000 is forbidden.
    ProjectNameText:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^(?=[\s\S]*\S)[^\u0000]*$'
      description: Nonblank project display name; surrounding whitespace counts toward the limit and is trimmed before storage. U+0000 is forbidden.
    NoteText:
      type: string
      minLength: 1
      maxLength: 20000
      pattern: '^(?=[\s\S]*\S)[^\u0000]*$'
      description: Nonblank note text; surrounding whitespace counts toward the limit and is trimmed before storage. U+0000 is forbidden.
    DescriptionText:
      type: string
      maxLength: 20000
      pattern: '^[^\u0000]*$'
      description: Formatting-preserving text. U+0000 is forbidden.
    NullableDescriptionText:
      type: [string, 'null']
      maxLength: 20000
      pattern: '^[^\u0000]*$'
      description: Formatting-preserving text or null. U+0000 is forbidden in strings.
    DiaryMarkdown:
      type: string
      pattern: '^[^\u0000]*$'
      description: Markdown limited to 100,000 Unicode words. U+0000 is forbidden.
    Version:
      type: object
      required: [service, api_version, version, commit]
      additionalProperties: false
      properties:
        service: {type: string, const: silicon-commit}
        api_version: {type: string, const: v1}
        version: {type: string, minLength: 1}
        commit: {type: string, minLength: 1}
    ActorId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^(?=[\s\S]*\S)[^\u0000-\u001F\u007F-\u009F]*$'
      description: 'An account named by its current c:/si: id (case-insensitive) or its permanent Silicon Accounts uuid (exact). Ids can change; store uuids. Raw surrounding whitespace is trimmed; control characters are forbidden.'
    AttachmentUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https://'
      description: Canonical absolute HTTPS URL from any provider; credentials, fragments, surrounding whitespace, control characters, and non-default ports are forbidden. Query strings are allowed. Commit stores and
        returns this URL; uploading and fetching remain outside its scope.
    ActorRef:
      type: object
      required: [type, id, uuid]
      additionalProperties: false
      description: 'An account: kind, current id (empty for a deleted account) and permanent uuid.'
      properties:
        type: {type: string, enum: [carbon, silicon]}
        id: {type: string, maxLength: 255}
        uuid: {type: string, minLength: 1, maxLength: 160}
    TodoStatus: {type: string, enum: [completed, canceled, in_progress, blocked, yet_to_do]}
    NotificationRule:
      description: A normalized delegated-todo event rule. `specific_statuses` matches transitions into one of the listed existing todo states.
      oneOf:
      - type: object
        required: [scope]
        additionalProperties: false
        properties:
          scope: {type: string, enum: [any_update, status_updates]}
          statuses: {type: array, maxItems: 0, uniqueItems: true, default: [], items: {$ref: '#/components/schemas/TodoStatus'}}
      - type: object
        required: [scope, statuses]
        additionalProperties: false
        properties:
          scope: {type: string, const: specific_statuses}
          statuses: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/TodoStatus'}}
    WebhookUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^https://[^/?#@]+(/[^?#]*)?$'
      description: Canonical HTTPS webhook destination. Credentials, query, fragment, non-default port, localhost, and non-public literal addresses are forbidden.
    NotificationSettingsUpdate:
      type: object
      required: [webhook_url, todo_list_subscription]
      additionalProperties: false
      properties:
        webhook_url:
          oneOf:
          - $ref: '#/components/schemas/WebhookUrl'
          - type: 'null'
        todo_list_subscription:
          oneOf:
          - $ref: '#/components/schemas/NotificationRule'
          - type: 'null'
    NotificationSettings:
      type: object
      required: [webhook_url, todo_list_subscription, version, updated_at]
      additionalProperties: false
      properties:
        webhook_url:
          oneOf:
          - $ref: '#/components/schemas/WebhookUrl'
          - type: 'null'
        todo_list_subscription:
          oneOf:
          - $ref: '#/components/schemas/NotificationRule'
          - type: 'null'
        version: {type: integer, format: int64, minimum: 0}
