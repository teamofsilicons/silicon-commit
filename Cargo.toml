[workspace]
members = ["client", "cli"]
resolver = "2"

[package]
name = "silicon-commit"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "commit-api"

[lib]
name = "silicon_commit"
path = "src/lib.rs"

[[bin]]
name = "commit-api"
path = "src/bin/commit_api.rs"

[[bin]]
name = "commit-worker"
path = "src/bin/commit_worker.rs"

[[bin]]
name = "commit-migrate"
path = "src/bin/commit_migrate.rs"

[dependencies]
space-station = "0.1.1"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "matched-path"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
rand = "0.10.0"
dotenvy = "0.15.7"
hex = "0.4.3"
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "http2",
  "json",
  "query",
  "rustls",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
silicon-iam-client = "1.8.0"
slug = "0.1.6"
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-rustls-ring-native-roots",
  "uuid",
] }
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "catch-panic",
  "cors",
  "sensitive-headers",
  "trace",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
unicode-segmentation = "1.12.0"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
hmac = "0.12.1"
http-body-util = "0.1.3"
proptest = "1.8.0"
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
struct_field_names = "allow"
todo = "deny"
too_many_lines = "allow"
unimplemented = "deny"
unused_async = "allow"
unwrap_used = "deny"
