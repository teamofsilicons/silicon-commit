[package]
name = "silicon-commit-client"
version = "0.2.0"
edition = "2024"
description = "Stateless Rust client for Silicon Commit"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-commit"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
url = "2.5.7"
uuid = { version = "1.26.0", features = ["v4"] }
secrecy = "0.10.3"

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
