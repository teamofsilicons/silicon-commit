name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: silicon_commit_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d silicon_commit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COMMIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/silicon_commit_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Verify runtime database grants
        env:
          PGPASSWORD: postgres
        run: |
          psql "$COMMIT_TEST_DATABASE_URL" --set=ON_ERROR_STOP=1 \
            --command='CREATE ROLE commit_ci_api NOLOGIN; CREATE ROLE commit_ci_worker NOLOGIN;'
          psql "$COMMIT_TEST_DATABASE_URL" \
            --set=database_name=silicon_commit_test \
            --set=schema_owner=postgres \
            --set=api_role=commit_ci_api \
            --set=worker_role=commit_ci_worker \
            --file=deploy/postgres_runtime_grants.sql
          psql "$COMMIT_TEST_DATABASE_URL" \
            --set=api_role=commit_ci_api \
            --set=worker_role=commit_ci_worker \
            --file=tests/postgres_runtime_grants.sql

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2.49.0 lint openapi.yaml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build
          --build-arg GIT_COMMIT_SHA="$GITHUB_SHA"
          --tag silicon-commit:ci
          .

  package:
    # The release packs every target the same way (release.yml); this proves the Linux archive on every change.
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned glibc 2.28 toolchain and the Silicon Apps packer
        run: |
          python -m pip install 'cargo-zigbuild==0.23.4' 'ziglang==0.15.2'
          python -c 'from pathlib import Path; import ziglang; print("CARGO_ZIGBUILD_ZIG_PATH=" + str(Path(ziglang.__file__).with_name("zig")))' >> "$GITHUB_ENV"
          cargo install --locked silicon-apps-cli --version 0.2.0
      - run: cargo zigbuild --locked -p silicon-commit-cli --bin commit --target x86_64-unknown-linux-gnu.2.28
      - name: Pack the CLI for linux-x86_64 with the discovery commands required
        run: >-
          scripts/package-apps.sh "$(python scripts/package_apps.py version)" linux-x86_64
          target/x86_64-unknown-linux-gnu/debug/commit --discovery require

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix docs-site
      - run: npm run build --prefix docs-site && npm run check --prefix docs-site
      - name: Verify bundled CLI guides
        run: |
          for guide in cli/docs/*.md; do
            cmp "$guide" "docs/$(basename "$guide")"
          done

  deployment-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 deploy/aws/test_bootstrap.py
      - run: python3 deploy/aws/test_cutover.py
      - run: python3 deploy/aws/test_host.py
      - run: python3 scripts/test_linux_abi.py
      - run: python3 scripts/test_package_apps.py
      - run: python3 scripts/test_dev_accounts.py
      - run: >-
          python3 -m py_compile deploy/aws/bootstrap.py deploy/aws/deploy_docs.py deploy/aws/host.py
          deploy/aws/cutover.py scripts/package_apps.py scripts/check_linux_abi.py scripts/dev_accounts.py
          tests/e2e/accounts_e2e.py
      - run: >-
          for script in scripts/package-apps.sh scripts/build-release-macos.sh docs/install.sh
          scripts/dev-accounts.sh scripts/dev-accounts-stop.sh scripts/e2e-accounts.sh; do bash -n "$script"; done
