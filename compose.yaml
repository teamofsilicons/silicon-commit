services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: silicon_commit
      POSTGRES_USER: commit
      POSTGRES_PASSWORD: commit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commit -d silicon_commit"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - commit-postgres:/var/lib/postgresql/data

volumes:
  commit-postgres:
