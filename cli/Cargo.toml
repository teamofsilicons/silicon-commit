[package]
name = "silicon-commit-cli"
version = "0.1.1"
edition = "2024"
description = "Command-line client for Silicon Commit"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-commit"
readme = "README.md"

[[bin]]
name = "commit"
path = "src/main.rs"

[dependencies]
silicon-commit-client = { version = "0.1.0", path = "../client" }
clap = { version = "4.5.48", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6.5"
