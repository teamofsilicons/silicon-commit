[package]
name = "commit"
version = "0.1.0"
edition = "2024"
description = "Command-line client for Silicon Commit"
license = "MIT"

[dependencies]
silicon-commit-client = { version = "0.1.0", path = "../client" }
clap = { version = "4.5.48", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
